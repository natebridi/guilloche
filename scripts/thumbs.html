<!doctype html>

  <head>
    <meta charset="utf-8" />
    <title>guilloche thumbnail generator</title>
    <style>
      html, body { margin: 0; background: #000; }
    </style>
  </head>
  <body>
    <!--
      Dev-only generator surface for scripts/thumbs.mjs. This file is NOT a
      route: vite.config.ts lists its entries explicitly (landing + create), so

      serves any file under the project root, which is exactly what we want —
      real TS, real shader imports, no separate build step.
    -->
