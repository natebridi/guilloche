# Netlify deploy config for the editor app.
# Vercel needs no config file — it auto-detects Vite (build: `npm run build`,
# output: `dist`). This file is only read by Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The app has no client-side router — state lives in the query string — so no
# SPA redirect rules are needed.

# Hashed asset filenames are content-addressed and safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
