# Netlify deploy config. Vercel needs no config file — it auto-detects Vite
# (build: `npm run build`, output: `dist`). This file is only read by Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Two static routes, and neither needs a rule: Vite emits dist/index.html and
# dist/create/index.html, and Netlify resolves /create to /create/index.html on
# its own. There is no client-side router anywhere — the editor's state lives
# in the query string, so /create?v1=... is a plain document request.

# The embed demo used to live here before it became the landing page.
[[redirects]]
  from = "/demo/embed.html"
  to = "/"
  status = 301

# Hashed asset filenames are content-addressed and safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
